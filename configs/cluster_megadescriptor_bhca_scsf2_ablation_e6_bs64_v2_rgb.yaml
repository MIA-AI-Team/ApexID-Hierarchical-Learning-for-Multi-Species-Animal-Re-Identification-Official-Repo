# MegaDescriptor E6 ablation (batch 64): lambda_SP=0.50, lambda_W=0. PK 16x4; try larger batch on H100 80GB.
# No mid-training validation (every_n_epochs=999; last epoch still validates once).
experiment:
  name: apexid_megadescriptor_l_384_bhca_scsf2_ablation_e6_bs64_v2_rgb
  output_dir: outputs/apexid_megadescriptor_l_384_bhca_scsf2_ablation_e6_bs64_v2_rgb
seed: 42
device: {prefer_gpu: true, gpu_index: 0}
data:
  train_path: /sc/home/mohammed.mohammed/ApexID/open_set_splits_v2/train.csv
  val_known_path: /sc/home/mohammed.mohammed/ApexID/open_set_splits_v2/val_known.csv
  val_unknown_path: /sc/home/mohammed.mohammed/ApexID/open_set_splits_v2/val_unknown.csv
  val_path: /sc/home/mohammed.mohammed/ApexID/open_set_splits_v2/val.csv
  root_dir: /sc/projects/sci-aisc/apex-id/extracted/apexid-dataset
  image_size: [384, 384]
  wavelet: false
  grayscale: false
  transforms:
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]
dataloader:
  batch_size: 64
  val_batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  sampler:
    name: pk
    num_identities: 16
    num_instances: 4
    batches_per_epoch: null
    shuffle: true
model:
  name: apexid
  embedding_dim: 1536
  input_channels: 3
  backbone:
    name: megadescriptor_l_384_pt
    kwargs:
      pretrained: true
      revision: 33b3c6f4ee0c386a4126cc3dcd23843920613fa1
      grad_checkpointing: true
head:
  name: BHCA_SCSF2
  kwargs:
    magn_type: A
    alpha: 0.9
    r: 40.0
    identity_margin: 0.30
    t: 3.0
    lw: 20.0
    species_margin: 0.10
    species_weight: 0.50
    within_species_weight: 0.0
    within_negative_reduction: sum
    num_subcenters: 2
    species_balance: sqrt_inverse_identity_frequency
loss: {name: null, kwargs: {}}
optimizer:
  name: adamW
  kwargs: {weight_decay: 0.0001, foreach: true}
lr_range_test:
  enabled: false
finetune:
  enabled: true
  strategy: full
  optimizer:
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4
  scheduler:
    name: cosine_annealing_lr
    kwargs: {T_max: null, eta_min: 1.0e-6}
    warmup: {enabled: true, epochs: 5, start_lr: 1.0e-6}
  lr_range_test:
    enabled: false
training:
  epochs: 150
  progress: true
  verbose: true
  gradient_clip_norm: 5.0
  classification_ignore_index: -100
  metric_ignore_index: null
validation:
  every_n_epochs: 999
  metric_chunk_size: 1024
  metrics: [top1, top5, mAP, micro_f1]
evaluation:
  compute_known: true
  compute_unknown: true
  compute_rejection: true
  compute_mixed: true
  diagnostics_every_n_epochs: 999
  diagnostics: {enabled: false, max_pairs: 100000}
  cmc_ranks: [20, 50]
  sample_limits: {gallery: null, known: null, unknown: null, mixed: null}
  top_k: [1, 5, 10]
  known_unknown_threshold: null
  clustering: {method: threshold_connected_components, threshold: 0.5}
  rejection: {fpr95_target_tpr: 0.95}
  dir: {far_levels: [0.01, 0.001]}
embedding_plot:
  enabled: false
checkpoint:
  output_dir: outputs/apexid_megadescriptor_l_384_bhca_scsf2_ablation_e6_bs64_v2_rgb/checkpoints
  every_n_epochs: 1
  filename: last_checkpoint.pt
  delete_previous: true
  resume_path: null
early_stopping:
  enabled: true
  monitor: known/mAP
  mode: max
  patience: 999
  min_delta: 0.0
  output_dir: outputs/apexid_megadescriptor_l_384_bhca_scsf2_ablation_e6_bs64_v2_rgb/checkpoints
  full_model_name: best_full_model.pt
  backbone_name: best_backbone.pt
  metadata_name: best_metadata.json
tracking:
  enabled: true
  provider: wandb
  project: ApexID
  entity: MIA_AI_Team
  run_name: ApexID-megadescriptor-l-384-bhca-scsf2-ablation-e6-bs64-v2-rgb
  group: bhca-convnext-ablation-v2
  tags: [split_v2, rgb, megadescriptor_l_384, pretrained, bhca, bhca_scsf2, ablation_e6_bs64, no_mid_val, emb1536]
  mode: online
  log_artifacts: none
  block_on_artifact_upload: false
  artifact_finish_timeout: 300
