experiment:
  name: apexid_osnet_sphereface2
  output_dir: outputs/apexid_osnet_sphereface2
seed: 42
device:
  prefer_gpu: true
  gpu_index: 0
data:
  train_path: animals/fine_tune_train.csv
  val_path: animals/val_all.csv
  train_csv: null
  val_csv: null
  root_dir: animals
  image_size:
  - 440
  - 440
  wavelet: false
  transforms:
    mean:
    - 0.350194
    - 0.352513
    - 0.322936
    std:
    - 0.313112
    - 0.302449
    - 0.288811
dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  sampler:
    name: pk
    num_identities: 4
    num_instances: 8
    batches_per_epoch: null
    shuffle: true
model:
  name: apexid
  embedding_dim: 512
  input_channels: 3
  backbone:
    name: osnet_x0_25
    kwargs: {}
head:
  name: sphereface2
  kwargs:
    magn_type: C
    alpha: 0.7
    r: 40.0
    m: 0.4
    t: 3.0
    lw: 50.0
loss:
  name: null
  kwargs: {}
optimizer:
  name: adam
  kwargs:
    lr: 0.001
    weight_decay: 0.0
scheduler:
  name: null
  kwargs: {}
training:
  epochs: 100
  progress: true
  verbose: true
  gradient_clip_norm: 7.0
  classification_ignore_index: -100
  metric_ignore_index: null
validation:
  every_n_epochs: 1
  metrics:
  - top1
  - top5
  - mAP
  - micro_f1
checkpoint:
  output_dir: outputs/apexid_osnet_sphereface2/checkpoints
  every_n_epochs: 1
  filename: last_checkpoint.pt
  delete_previous: true
  resume_path: null
early_stopping:
  enabled: true
  monitor: val_mAP
  mode: max
  patience: 10
  min_delta: 0.0
  output_dir: outputs/apexid_osnet_sphereface2/checkpoints
  full_model_name: best_full_model.pt
  backbone_name: best_backbone.pt
  metadata_name: best_metadata.json
tracking:
  enabled: true
  provider: wandb
  project: ApexID
  entity: null
  run_name: null
  group: null
  tags: []
  mode: online
  log_artifacts: best
