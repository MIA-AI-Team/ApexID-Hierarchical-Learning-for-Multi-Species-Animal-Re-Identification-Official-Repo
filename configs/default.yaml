experiment:
  name: apexid_osnet_arcface
  output_dir: outputs/apexid_osnet_arcface
seed: 42
device:
  prefer_gpu: true
  gpu_index: 0
data:
  train_path: ApexID_Dataset/open_set_splits/train.csv
  val_known_path: ApexID_Dataset/open_set_splits/val_known.csv
  val_unknown_path: ApexID_Dataset/open_set_splits/val_unknown.csv
  val_path: ApexID_Dataset/open_set_splits/val.csv
  train_csv: null
  val_known_csv: null
  val_unknown_csv: null
  val_csv: null
  root_dir: ApexID_Dataset
  image_size:
  - 440
  - 440
  wavelet: false
  transforms:
    mean:
    - 0.158895
    - 0.156707
    - 0.15302
    std:
    - 0.248437
    - 0.242192
    - 0.237389
dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  sampler:
    name: pk
    num_identities: 16
    num_instances: 2
    batches_per_epoch: null
    shuffle: true
model:
  name: apexid
  embedding_dim: 128
  input_channels: 3
  backbone:
    name: osnet_x0_25
    kwargs: {}
head:
  name: arcface
  kwargs:
    s: 64.0
    m: 0.5
loss:
  name: cross_entropy
  kwargs: {}
optimizer:
  name: adam
  kwargs:
    lr: 0.0003
    weight_decay: 0.0001
lr_range_test:
  enabled: true
  mode: auto_apply
  start_lr: 1.0e-07
  end_lr: 0.01
  num_iter: 100
  smooth_beta: 0.98
  stop_factor: 4.0
  base_lr_divisor: 4.0
  output_dir: null
scheduler:
  name: cyclic_lr
  kwargs:
    base_lr: 1.0e-05
    max_lr: 0.0003
    step_size_epochs: 4
    mode: triangular2
    cycle_momentum: false
training:
  epochs: 100
  progress: true
  verbose: true
  gradient_clip_norm: 7.0
  classification_ignore_index: -100
  metric_ignore_index: null
validation:
  every_n_epochs: 1
  metric_chunk_size: 1024
  metrics:
  - top1
  - top5
  - mAP
  - micro_f1
evaluation:
  compute_known: true
  compute_unknown: true
  compute_rejection: true
  compute_mixed: true
  diagnostics_every_n_epochs: 5
  diagnostics:
    enabled: true
    max_pairs: 100000
  cmc_ranks:
  - 1
  - 5
  - 10
  - 20
  - 50
  sample_limits:
    gallery: null
    known: null
    unknown: null
    mixed: null
  top_k:
  - 1
  - 5
  - 10
  known_unknown_threshold: null
  clustering:
    method: threshold_connected_components
    threshold: 0.5
  rejection:
    fpr95_target_tpr: 0.95
  dir:
    far_levels:
    - 0.01
    - 0.001
embedding_plot:
  enabled: false
  split: val
  output_dir: null
  best_output_dir: null
  n_neighbors: 15
  min_dist: 0.1
  metric: euclidean
  random_state: null
  point_size: 8
  alpha: 0.85
  dpi: 200
  max_points: null
  filename_template: epoch_{epoch_number:03d}_umap.png
  best_filename: best_embedding_space.png
checkpoint:
  output_dir: outputs/apexid_osnet_arcface/checkpoints
  every_n_epochs: 1
  filename: last_checkpoint.pt
  delete_previous: true
  resume_path: null
early_stopping:
  enabled: true
  monitor: mixed/NormAcc
  mode: max
  patience: 10
  min_delta: 0.0
  output_dir: outputs/apexid_osnet_arcface/checkpoints
  full_model_name: best_full_model.pt
  backbone_name: best_backbone.pt
  metadata_name: best_metadata.json
tracking:
  enabled: false
  provider: wandb
  project: ApexID
  entity: null
  run_name: null
  group: null
  tags: []
  mode: online
  log_artifacts: none
  block_on_artifact_upload: false
  artifact_finish_timeout: 300
