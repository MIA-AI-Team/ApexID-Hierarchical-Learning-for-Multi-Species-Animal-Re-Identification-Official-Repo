experiment:
  name: apexid_convnext_large_arcface_scratch
  output_dir: outputs/apexid_convnext_large_arcface_scratch
seed: 42
device:
  prefer_gpu: true
  gpu_index: 0
data:
  train_path: /sc/projects/sci-aisc/apex-id/extracted/apexid-dataset/open_set_splits/train.csv
  val_known_path: /sc/projects/sci-aisc/apex-id/extracted/apexid-dataset/open_set_splits/val_known.csv
  val_unknown_path: /sc/projects/sci-aisc/apex-id/extracted/apexid-dataset/open_set_splits/val_unknown.csv
  val_path: /sc/projects/sci-aisc/apex-id/extracted/apexid-dataset/open_set_splits/val.csv
  train_csv: null
  val_known_csv: null
  val_unknown_csv: null
  val_csv: null
  root_dir: /sc/projects/sci-aisc/apex-id/extracted/apexid-dataset/
  image_size:
  - 440
  - 440
  wavelet: false
  transforms:
    mean:
    - 0.152443
    - 0.150199
    - 0.146532
    std:
    - 0.246863
    - 0.240918
    - 0.235914
dataloader:
  batch_size: 24
  val_batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  sampler:
    name: pk
    num_identities: 6
    num_instances: 4
    batches_per_epoch: null
    shuffle: true
model:
  name: apexid
  embedding_dim: 512
  input_channels: 3
  backbone:
    name: convnext_large
    kwargs:
      pretrained: false
head:
  name: arcface
  kwargs:
    s: 40.0
    m: 0.3
loss:
  name: cross_entropy
  kwargs: {}
optimizer:
  name: adamW
  kwargs:
    lr: 0.0003
    weight_decay: 0.0001
    foreach: true
lr_range_test:
  enabled: true
  mode: auto_apply
  start_lr: 1.0e-07
  end_lr: 0.01
  num_iter: 100
  smooth_beta: 0.98
  stop_factor: 4.0
  base_lr_divisor: 4.0
  output_dir: null
scheduler:
  name: cyclic_lr
  kwargs:
    base_lr: 1.0e-05
    max_lr: 0.0003
    step_size_epochs: 4
    mode: triangular2
    cycle_momentum: false
training:
  epochs: 300
  progress: true
  verbose: true
  gradient_clip_norm: null
  classification_ignore_index: -100
  metric_ignore_index: null
validation:
  every_n_epochs: 1
  metric_chunk_size: 1024
  metrics:
  - top1
  - top5
  - mAP
  - micro_f1
evaluation:
  compute_known: true
  compute_unknown: true
  compute_rejection: true
  compute_mixed: true
  diagnostics_every_n_epochs: 5
  diagnostics:
    enabled: true
    max_pairs: 100000
  cmc_ranks:
  - 20
  - 50
  sample_limits:
    gallery: null
    known: null
    unknown: null
    mixed: null
  top_k:
  - 1
  - 5
  - 10
  known_unknown_threshold: null
  clustering:
    method: threshold_connected_components
    threshold: 0.5
  rejection:
    fpr95_target_tpr: 0.95
  dir:
    far_levels:
    - 0.01
    - 0.001
embedding_plot:
  enabled: false
  split: val
  output_dir: null
  best_output_dir: null
  n_neighbors: 15
  min_dist: 0.1
  metric: euclidean
  random_state: null
  point_size: 8
  alpha: 0.85
  dpi: 200
  max_points: null
  filename_template: epoch_{epoch_number:03d}_umap.png
  best_filename: best_embedding_space.png
checkpoint:
  output_dir: outputs/apexid_convnext_large_arcface_scratch/checkpoints
  every_n_epochs: 1
  filename: last_checkpoint.pt
  delete_previous: true
  resume_path: null
early_stopping:
  enabled: true
  monitor: known/mAP
  mode: max
  patience: 10
  min_delta: 0.0
  output_dir: outputs/apexid_convnext_large_arcface_scratch/checkpoints
  full_model_name: best_full_model.pt
  backbone_name: best_backbone.pt
  metadata_name: best_metadata.json
tracking:
  enabled: true
  provider: wandb
  project: ApexID
  entity: MIA_AI_Team
  run_name: ApexID-convnext-large-arcface-40-0.3-scratch
  group: null
  tags:
  - convnext
  - convnext_large
  - arcface
  - '40'
  - '0.3'
  - scratch
  - no-wavelet
  - apexid
  mode: online
  log_artifacts: none
  block_on_artifact_upload: false
  artifact_finish_timeout: 300
finetune:
  enabled: auto
  strategy: full
  head_only_epochs: 3
  unfreeze_top_fraction: 0.0
  optimizer:
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4
    head_lr_multiplier: null
    backbone_weight_decay: null
    head_weight_decay: null
  scheduler:
    name: cosine_annealing_lr
    kwargs:
      T_max: null
      eta_min: 1.0e-6
    warmup:
      enabled: true
      epochs: 5
      start_lr: 1.0e-6
  lr_range_test:
    enabled: false
    mode: suggest_lr
    apply_to: head
    backbone_lr_divisor: 10.0
