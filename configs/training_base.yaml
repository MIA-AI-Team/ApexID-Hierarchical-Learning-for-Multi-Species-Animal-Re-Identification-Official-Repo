# Shared training, data and validation settings. Select an experiment preset.
seed: 42
device:
  prefer_gpu: true
  gpu_index: 0
data:
  train_path: ${APEXID_SPLIT_ROOT:-open_set_splits_v2}/train.csv
  val_known_path: ${APEXID_SPLIT_ROOT:-open_set_splits_v2}/val_known.csv
  val_unknown_path: ${APEXID_SPLIT_ROOT:-open_set_splits_v2}/val_unknown.csv
  val_path: ${APEXID_SPLIT_ROOT:-open_set_splits_v2}/val.csv
  root_dir: ${APEXID_DATA_ROOT:-ApexID_Dataset}
  image_size:
  - 440
  - 440
  transforms:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
dataloader:
  batch_size: 64
  val_batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  sampler:
    name: pk
    num_identities: 16
    num_instances: 4
    batches_per_epoch: null
    shuffle: true
model:
  name: apexid
  embedding_dim: 2048
  input_channels: 3
  backbone:
    name: convnext_small_pt
    kwargs:
      pretrained: true
optimizer:
  name: adamW
  kwargs:
    weight_decay: 0.0001
    foreach: true
  backbone_lr: 1.0e-05
  head_lr: 0.0001
scheduler:
  name: cosine_annealing_lr
  kwargs:
    T_max: null
    eta_min: 1.0e-06
  warmup:
    enabled: true
    epochs: 5
    start_lr: 1.0e-06
training:
  epochs: 150
  progress: true
  verbose: true
  gradient_clip_norm: 5.0
  classification_ignore_index: -100
  metric_ignore_index: null
validation:
  every_n_epochs: 5
  metric_chunk_size: 1024
  metrics:
  - top1
  - top5
  - mAP
  - micro_f1
evaluation:
  compute_known: true
  compute_unknown: true
  compute_rejection: true
  compute_mixed: true
  diagnostics_every_n_epochs: 5
  diagnostics:
    enabled: true
    max_pairs: 100000
  cmc_ranks:
  - 20
  - 50
  sample_limits:
    gallery: null
    known: null
    unknown: null
    mixed: null
  top_k:
  - 1
  - 5
  - 10
  known_unknown_threshold: null
  clustering:
    method: threshold_connected_components
    threshold: 0.5
  rejection:
    fpr95_target_tpr: 0.95
  dir:
    far_levels:
    - 0.01
    - 0.001
checkpoint:
  every_n_epochs: 1
  filename: last_checkpoint.pt
  delete_previous: true
  resume_path: auto
early_stopping:
  enabled: true
  monitor: known/mAP
  mode: max
  patience: 150
  min_delta: 0.0
  full_model_name: best_full_model.pt
  backbone_name: best_backbone.pt
  metadata_name: best_metadata.json
