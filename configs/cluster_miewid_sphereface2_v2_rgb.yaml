# MiewID-msv3 + flat SphereFace2 on Split V2.
experiment:
  name: apexid_miewid_msv3_sphereface2_v2_rgb
  output_dir: outputs/apexid_miewid_msv3_sphereface2_v2_rgb
seed: 42
device: {prefer_gpu: true, gpu_index: 0}
data:
  train_path: /sc/home/mohammed.mohammed/ApexID/open_set_splits_v2/train.csv
  val_known_path: /sc/home/mohammed.mohammed/ApexID/open_set_splits_v2/val_known.csv
  val_unknown_path: /sc/home/mohammed.mohammed/ApexID/open_set_splits_v2/val_unknown.csv
  val_path: /sc/home/mohammed.mohammed/ApexID/open_set_splits_v2/val.csv
  root_dir: /sc/projects/sci-aisc/apex-id/extracted/apexid-dataset
  image_size: [440, 440]
  wavelet: false
  grayscale: false
  transforms:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
dataloader:
  batch_size: 32
  val_batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  sampler:
    name: pk
    num_identities: 8
    num_instances: 4
    batches_per_epoch: null
    shuffle: true
model:
  name: apexid
  embedding_dim: 2152
  input_channels: 3
  backbone:
    name: miewid_msv3_pt
    kwargs:
      pretrained: true
      revision: 4f1d7f2b521149e5fe34bb85f377248ce9971a7d
      expected_sha256: adff92b39678f37eb74861c6399a741639a8907ec2382738e903d6120727b348
head:
  name: sphereface2
  kwargs:
    magn_type: A
    alpha: 0.9
    r: 40.0
    m: 0.3
    t: 3.0
    lw: 20.0
loss: {name: null, kwargs: {}}
optimizer:
  name: adamW
  kwargs: {weight_decay: 0.0001, foreach: true}
lr_range_test:
  enabled: false
finetune:
  enabled: true
  strategy: full
  optimizer:
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4
  scheduler:
    name: cosine_annealing_lr
    kwargs: {T_max: null, eta_min: 1.0e-6}
    warmup: {enabled: true, epochs: 5, start_lr: 1.0e-6}
  lr_range_test:
    enabled: false
training:
  epochs: 150
  progress: true
  verbose: true
  gradient_clip_norm: 5.0
  classification_ignore_index: -100
  metric_ignore_index: null
validation:
  every_n_epochs: 5
  metric_chunk_size: 1024
  metrics: [top1, top5, mAP, micro_f1]
evaluation:
  compute_known: true
  compute_unknown: true
  compute_rejection: true
  compute_mixed: true
  diagnostics_every_n_epochs: 5
  diagnostics: {enabled: true, max_pairs: 100000}
  cmc_ranks: [20, 50]
  sample_limits: {gallery: null, known: null, unknown: null, mixed: null}
  top_k: [1, 5, 10]
  known_unknown_threshold: null
  clustering: {method: threshold_connected_components, threshold: 0.5}
  rejection: {fpr95_target_tpr: 0.95}
  dir: {far_levels: [0.01, 0.001]}
embedding_plot:
  enabled: false
checkpoint:
  output_dir: outputs/apexid_miewid_msv3_sphereface2_v2_rgb/checkpoints
  every_n_epochs: 1
  filename: last_checkpoint.pt
  delete_previous: true
  resume_path: auto
early_stopping:
  enabled: true
  monitor: known/mAP
  mode: max
  patience: 10
  min_delta: 0.0
  output_dir: outputs/apexid_miewid_msv3_sphereface2_v2_rgb/checkpoints
  full_model_name: best_full_model.pt
  backbone_name: best_backbone.pt
  metadata_name: best_metadata.json
tracking:
  enabled: true
  provider: wandb
  project: ApexID
  entity: MIA_AI_Team
  run_name: ApexID-miewid-msv3-sphereface2-v2-rgb
  group: wildlife-backbone-baseline-v2
  tags: [split_v2, rgb, miewid_msv3, pretrained, sphereface2, sphereface2_a, lw20, emb2152]
  mode: online
  log_artifacts: none
  block_on_artifact_upload: false
  artifact_finish_timeout: 300
