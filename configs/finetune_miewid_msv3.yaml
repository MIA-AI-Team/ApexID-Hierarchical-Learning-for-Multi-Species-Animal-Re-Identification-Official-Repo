# Native wildlife embeddings, SphereFace2, and full fine-tuning on Split V2.
experiment:
  name: miewid_msv3_finetune
  output_dir: ${APEXID_OUTPUT_ROOT:-outputs}/miewid_msv3_finetune
seed: 42
device:
  prefer_gpu: true
  gpu_index: 0
data:
  root_dir: ${APEXID_DATA_ROOT:-ApexID_Dataset}
  train_path: ${APEXID_SPLIT_ROOT:-open_set_splits_v2}/train.csv
  val_known_path: ${APEXID_SPLIT_ROOT:-open_set_splits_v2}/val_known.csv
  val_unknown_path: ${APEXID_SPLIT_ROOT:-open_set_splits_v2}/val_unknown.csv
  val_path: ${APEXID_SPLIT_ROOT:-open_set_splits_v2}/val.csv
  image_size: [440, 440]
  wavelet: false
  grayscale: false
  transforms:
    # Follow the provider's model-card embedding example.
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
dataloader:
  batch_size: 8
  val_batch_size: 16
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  sampler:
    name: pk
    num_identities: 2
    num_instances: 4
    batches_per_epoch: null
    shuffle: true
model:
  name: apexid
  embedding_dim: 2152
  input_channels: 3
  backbone:
    name: miewid_msv3_pt
    kwargs:
      pretrained: true
      revision: 4f1d7f2b521149e5fe34bb85f377248ce9971a7d
      expected_sha256: adff92b39678f37eb74861c6399a741639a8907ec2382738e903d6120727b348
head:
  name: sphereface2
  kwargs:
    magn_type: A
    alpha: 0.9
    r: 40.0
    m: 0.3
    t: 3.0
    lw: 20.0
loss:
  name: null
  kwargs: {}
optimizer:
  name: adamw
  kwargs:
    weight_decay: 0.0001
finetune:
  enabled: true
  strategy: full
  optimizer:
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4
  scheduler:
    name: cosine_annealing_lr
    kwargs:
      T_max: null
      eta_min: 1.0e-6
    warmup:
      enabled: true
      epochs: 5
      start_lr: 1.0e-6
  lr_range_test:
    enabled: false
training:
  epochs: 100
  progress: true
  verbose: true
  gradient_clip_norm: 5.0
  classification_ignore_index: -100
  metric_ignore_index: null
validation:
  every_n_epochs: 1
  metric_chunk_size: 1024
evaluation:
  compute_known: true
  compute_unknown: true
  compute_rejection: true
  compute_mixed: true
  diagnostics_every_n_epochs: 5
  sample_limits:
    gallery: null
    known: null
    unknown: null
    mixed: null
  top_k: [1, 5, 10]
  cmc_ranks: [20, 50]
  clustering:
    method: threshold_connected_components
    threshold: 0.5
embedding_plot:
  enabled: false
checkpoint:
  output_dir: ${APEXID_OUTPUT_ROOT:-outputs}/miewid_msv3_finetune/checkpoints
  every_n_epochs: 1
  filename: last_checkpoint.pt
  delete_previous: true
  resume_path: auto
early_stopping:
  enabled: true
  monitor: known/mAP
  mode: max
  patience: 10
  min_delta: 0.0
  output_dir: ${APEXID_OUTPUT_ROOT:-outputs}/miewid_msv3_finetune/checkpoints
tracking:
  enabled: false
